name: Bug report
description: Report a reproducible defect in SkillOS.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include commands and a minimal skill manifest. Remove credentials and private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
