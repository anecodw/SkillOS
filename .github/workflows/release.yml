name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Prepare release notes
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import os; p=Path('CHANGELOG.md').read_text(); tag=os.environ['GITHUB_REF_NAME']; version=tag.removeprefix('v'); start=p.find('## ['+version+']'); end=p.find('## [', start+4); Path('release-notes.md').write_text(p[start:end if end >= 0 else len(p)].strip()+'\\n')"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
